<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232327"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0cf80"/>
      <stop offset="1" stop-color="#c8963c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Schallloch -->
  <circle cx="256" cy="268" r="118" fill="none" stroke="url(#gold)" stroke-width="18"/>
  <circle cx="256" cy="268" r="84" fill="#0f0f11"/>
  <!-- Saiten -->
  <g stroke="url(#gold)" stroke-linecap="round">
    <line x1="96" y1="206" x2="416" y2="206" stroke-width="5"/>
    <line x1="96" y1="237" x2="416" y2="237" stroke-width="6"/>
    <line x1="96" y1="268" x2="416" y2="268" stroke-width="7"/>
    <line x1="96" y1="299" x2="416" y2="299" stroke-width="8"/>
    <line x1="96" y1="330" x2="416" y2="330" stroke-width="9"/>
  </g>
  <!-- Plektrum / Fingerpunkt -->
  <circle cx="256" cy="268" r="26" fill="url(#gold)"/>
  <!-- Schriftzug -->
  <text x="256" y="120" text-anchor="middle" font-family="-apple-system, 'SF Pro Rounded', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="56" fill="url(#gold)" letter-spacing="2">COACH</text>
</svg>
