name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Erkennungs-Benchmark (echte Aufnahmen + synthetischer Satz)
        run: npm run bench:detection
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: bench-results
          retention-days: 30
      - run: npm run build
      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium
      - name: End-to-End-Tests (inkl. Mikrofon-Simulation)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
